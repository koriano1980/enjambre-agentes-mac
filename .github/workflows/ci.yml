name: Pruebas
on:
  push:
  pull_request:
jobs:
  nucleo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2.4"
      - run: swift test
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c debug
      - run: swift test
