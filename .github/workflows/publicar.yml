name: Publicar disco
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
jobs:
  dmg:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Crear el disco de instalación
        run: bash scripts/crear-dmg.sh
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      - uses: actions/upload-artifact@v4
        with:
          name: Enjambre-dmg
          path: build/*.dmg
          if-no-files-found: error
      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/*.dmg \
            --title "Enjambre de Agentes ${GITHUB_REF_NAME}" \
            --notes "Arrastra Enjambre de Agentes a Aplicaciones y ábrelo. El asistente prepara Ollama y los permisos. No hace falta la Terminal."
